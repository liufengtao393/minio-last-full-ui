name: 编译并发布 MinIO 完整菜单版镜像

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出指定版本源码 (最后一个带完整菜单版)
        uses: actions/checkout@v4
        with:
          ref: RELEASE.2025-04-22T22-12-26Z

      - name: 设置 Go 编译环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 编译 MinIO 二进制文件
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o minio .

      - name: 登录 GitHub 镜像仓库 (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包并推送专属镜像到 GHCR
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/minio:RELEASE.2025-04-22T22-12-26Z \
                       -t ghcr.io/${{ github.repository_owner }}/minio:latest .
          docker push ghcr.io/${{ github.repository_owner }}/minio:RELEASE.2025-04-22T22-12-26Z
          docker push ghcr.io/${{ github.repository_owner }}/minio:latest
