name: 转存 MinIO 镜像到 GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  sync-image:
    runs-on: ubuntu-latest
    steps:
      - name: 登录 GitHub 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置多架构构建工具 (支持 X86 和 ARM NAS)
        uses: docker/setup-buildx-action@v3

      - name: 无损搬运双架构镜像到自己的 GHCR
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/minio:RELEASE.2025-04-22T22-12-26Z \
            -t ghcr.io/${{ github.repository_owner }}/minio:latest \
            minio/minio:RELEASE.2025-04-22T22-12-26Z
